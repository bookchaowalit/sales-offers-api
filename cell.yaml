# Offers cell: the priced catalogue of what Solo Empire sells (EOS domain 4, Offer & Product), 2026-10-27.
# One offer per thing a buyer can buy; its prices (per tier, currency and billing interval, with the
# payment link that collects each one) and the places where it is listed for sale.
# Amounts are real (float) like every kit cell; cross-cell ids (project_id, ...) are plain bigints, not foreign keys.
cell: offers
title: Offers
resources:
  offer:
    filters:
    - status
    - stream
    - kind
    - owner_scope
    fields:
      slug:
        type: text
        required: true
        unique: true
        max_length: 80
      title:
        type: text
        required: true
        max_length: 200
      # income stream id from business-catalog ventures/income-streams.yaml (freelance-seo, ...)
      stream:
        type: text
        required: true
        max_length: 80
      kind:
        type: enum
        values:
        - service
        - productized_service
        - digital_product
        - subscription
        - course
        default: productized_service
      status:
        type: enum
        values:
        - draft
        - priced
        - listed
        - paused
        - retired
        default: draft
      owner_scope:
        type: enum
        values:
        - personal
        - solo_empire
        - venture
        - client
        - shared
        default: solo_empire
      summary:
        type: text
      deliverables:
        type: text
      delivery_days:
        type: int
        min: 0
      # where the offer's scope, terms and price rationale are written (repo:path)
      terms_ref:
        type: text
      project_id:
        type: bigint
      goal_id:
        type: bigint
      source_ref:
        type: text
      notes: &id001
        type: text
  offer-price:
    filters:
    - offer_id
    - currency
    - billing_interval
    - active
    unique:
    - - offer_id
      - tier
      - currency
      - billing_interval
    ranges:
    - [valid_from, valid_to]
    fields:
      offer_id:
        type: ref
        to: offer
        required: true
      tier:
        type: text
        required: true
        max_length: 80
      amount:
        type: real
        min: 0
        required: true
      currency:
        type: text
        default: THB
        max_length: 12
      billing_interval:
        type: enum
        values:
        - one_time
        - monthly
        - quarterly
        - yearly
        default: one_time
      provider:
        type: text
        default: stripe
        max_length: 40
      # the provider's id for this price (Stripe price_..., payment link plink_...)
      provider_ref:
        type: text
        max_length: 200
      payment_link_url:
        type: text
        max_length: 500
      active:
        type: bool
        default: true
      valid_from:
        type: date
      valid_to:
        type: date
      notes: *id001
  offer-listing:
    filters:
    - offer_id
    - channel
    - status
    unique:
    - - offer_id
      - channel
    fields:
      offer_id:
        type: ref
        to: offer
        required: true
      # website, stripe-payment-link, fastwork, upwork, etsy, shopee, gumroad, ...
      channel:
        type: text
        required: true
        max_length: 80
      url:
        type: text
        max_length: 500
      status:
        type: enum
        values:
        - draft
        - live
        - paused
        - removed
        default: draft
      listed_on:
        type: date
      removed_on:
        type: date
      notes: *id001
