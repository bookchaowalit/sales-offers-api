# CI + security baseline (DevSecOps Phase 1). Public repository: GitHub-hosted runners.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/ci-python.yml@87dc5e1c7e0416886a6371d5a101bb2ccba38edd # v1.1.1
    with:
      # The image runs 3.13, but the tests' embedded PostgreSQL (pgserver, dev extra) only ships
      # wheels up to cp312. Move to 3.13 once pgserver does.
      python-version: "3.12"
      # Ratchet: measured 59.89% on 2026-10-22 (threshold = measured - 2); raise it as tests grow.
      coverage-threshold: "57"

  security:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/security.yml@87dc5e1c7e0416886a6371d5a101bb2ccba38edd # v1.1.1

  # CD: offers-api has no Railway GitHub source (the dashboard's repo list does not show this
  # repository and the API refuses serviceConnect), so after CI passes on main this job uploads the
  # checked-out commit with `railway up`, the same as a clean `git archive` deploy, and smoke-tests
  # /health. RAILWAY_TOKEN is a project token for sales-offers-api/production only (Infisical
  # /railway RAILWAY_TOKEN_SALES_OFFERS_API). Off unless the repository variable CD_DEPLOY is "true".
  deploy:
    needs: [api, security]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && vars.CD_DEPLOY == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: deploy-offers-api
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the Railway CLI
        run: npm install --global @railway/cli@5.71.0
      - name: Deploy this commit to offers-api
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          rm -rf .git
          railway up --service 461fcc0a-5a22-413f-ae00-bed8b1b4a14f --environment production --ci
      - name: Smoke-test /health
        run: |
          for attempt in $(seq 1 12); do
            body=$(curl -fsS --max-time 30 https://offers-api-production.up.railway.app/health) && \
              echo "$body" | grep -q '"status":"ok"' && { echo "healthy: $body"; exit 0; }
            sleep 10
          done
          echo "::error::offers-api /health did not answer ok after the deploy of ${GITHUB_SHA}; roll back by redeploying the previous deployment in Railway"
          exit 1
